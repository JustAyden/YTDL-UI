name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Check JavaScript syntax
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: for f in static/js/*.js; do node --check "$f"; done
      - name: Config example is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python server.py --write-example-config | diff -u config.example.ini -

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ytdl-ui:ci .
      - name: Start container and wait for health
        run: |
          docker run -d --name ytdlui -p 5000:5000 -e YTDLUI_YTDLP_AUTO_UPDATE=false -e YTDLUI_UPDATE_CHECK=false ytdl-ui:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/api/config | python3 -c "import json,sys; c=json.load(sys.stdin); assert c['ytdlp_ok'] and c['ffmpeg_ok'], c; print('yt-dlp', c['ytdlp_version'])"
          docker exec ytdlui deno --version
      - if: always()
        run: docker logs ytdlui || true
