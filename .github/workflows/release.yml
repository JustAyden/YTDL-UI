name: Release builds

# Push a tag like v2.0.0 to build every platform and publish a GitHub release
# (the in-app updater reads these releases). Pull requests build and smoke-test
# every platform too and attach the apps as workflow artifacts, without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64,   os: windows-latest }
          - { target: windows-arm64, os: windows-11-arm }
          - { target: macos-arm64,   os: macos-latest }
          - { target: macos-x64,     os: macos-15-intel }
          - { target: linux-x64,     os: ubuntu-22.04 }      # older glibc = runs on more distros
          - { target: linux-arm64,   os: ubuntu-22.04-arm }  # Raspberry Pi 4/5 (64-bit OS), ARM servers
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Build
        run: python packaging/build.py
      - name: Smoke test
        shell: bash
        run: python packaging/smoke_test.py dist/ytdl-ui-${{ matrix.target }}$([ "${{ runner.os }}" = "Windows" ] && echo .exe)
      - uses: actions/upload-artifact@v4
        with:
          name: ytdl-ui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: |
          cd dist
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          python3 - <<'EOF' > notes.md
          import re
          tag = "${{ github.ref_name }}".lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[?v?{re.escape(tag)}\]?.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else f"YTDL-UI {tag}")
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: YTDL-UI ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*

  docker:
    name: Docker image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ytdl-ui" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
