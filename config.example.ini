# YTDL-UI configuration
# Copy to config.ini and uncomment what you want to change.
# Any setting can also be set with an environment variable: YTDLUI_<NAME>
# (e.g. YTDLUI_PROCESSING_MODE=browser) or on the command line with
# --set name=value. Precedence: CLI > environment > admin panel > config.ini > defaults.
# (Changes made in the admin panel's Settings are saved in data/settings.json.)


[server]

# Address to bind. 127.0.0.1 = this machine only (use with a reverse proxy/tunnel);
# 0.0.0.0 = every network interface.
# host = 127.0.0.1

# Port to listen on.
# port = 5000

# Worker threads for the HTTP server. Each in-flight download or relay holds one.
# threads = 16

# How many reverse proxies sit in front of the app (0 = none). Set to 1 behind
# Caddy/Nginx/cloudflared so rate limits see real client IPs, or 'cloudflare' to trust
# the CF-Connecting-IP header.
# trust_proxy = 0

# Where temp downloads, caches and update state live (relative to the app folder).
# data_dir = data

# Log the full URL of every download. Off by default: only the site is logged.
# log_urls = false

# How visitors can reach you about privacy (an email address or a link), shown on the
# /privacy page. Empty = no contact is listed.
# privacy_contact = 

[security]

# Optional password visitors must enter before using the site.
# password = 

# Enable the admin panel (⚙): updates, job overview, cleanup, password and 2FA settings.
# admin_enabled = true

# Initial admin password, used only until the admin replaces it (the first login forces
# a TOTP 2FA setup and a password change; afterwards credentials live in
# data/admin.json). Empty = generate a random one on first start and print it to the log
# and data/initial-admin-password.txt. Lost access? Run with --reset-admin.
# admin_password = 

# Failed password/2FA attempts allowed per IP before that IP is locked out.
# login_max_attempts = 5

# First lockout length. Each repeat lockout of the same IP doubles it (max 24 h).
# login_lockout_minutes = 15

# Comma-separated domains users may download from (e.g. youtube.com, youtu.be,
# soundcloud.com). Empty = anything yt-dlp supports.
# allowed_sites = 

# Allow URLs that resolve to private/LAN/loopback addresses. Keep off on public servers.
# allow_private_urls = false

# Metadata lookups per minute per client IP.
# rate_limit = 30

# New downloads per minute per client IP.
# download_rate_limit = 10

[limits]

# Server-side downloads that run at the same time. Extra jobs wait in a queue.
# max_concurrent_jobs = 2

# Queued + running server downloads allowed per client IP.
# max_jobs_per_client = 3

# Maximum queued server downloads overall.
# max_queue = 25

# Reject videos longer than this (0 = no limit).
# max_duration_minutes = 0

# Reject downloads larger than this (0 = no limit).
# max_filesize_mb = 0

# Most playlist entries one request may download.
# max_playlist_items = 100

# How long finished files stay on the server for the user to save them.
# job_ttl_minutes = 30

# Kill a server download that runs longer than this.
# job_timeout_minutes = 120

# Refuse new server downloads when free disk space drops below this.
# min_free_space_mb = 1024

# Cap, in MB/s, on the media traffic this server handles for users, so downloads can't
# starve its network connection. Finished files, playlist ZIPs and relayed browser-mode
# streams share it; server-side yt-dlp downloads are capped at the same total (split
# evenly across max_concurrent_jobs). Decimals are fine (e.g. 2.5). 0 = unlimited.
# bandwidth_limit = 10

[processing]

# Where downloads are processed. server = yt-dlp + ffmpeg on this machine. browser = the
# visitor's device does the work with ffmpeg.wasm and the server only looks up stream
# URLs (and relays bytes when a site requires it). choice = visitors can switch between
# the two.
# One of: server, browser, choice
# processing_mode = choice

# Initial choice when processing_mode = choice. auto = use the browser when the device
# looks capable (not on a metered/slow connection), otherwise the server.
# One of: server, browser, auto
# processing_default = server

# When browser processing can't handle a link (HLS-only sites, too big, very old
# browser), fall back to server processing instead of failing. Ignored when
# processing_mode = browser and this is false — then the server never downloads.
# fallback_to_server = true

# Let the server stream media bytes to the browser when the source blocks direct browser
# access (YouTube always does: its URLs are locked to the server's IP). Relayed bytes
# are never written to disk and never touch ffmpeg.
# relay = true

# Largest download (MB) the browser is asked to process in memory.
# browser_max_mb = 1024

# Default accent color (hex, e.g. #22d3ee). The whole Material 3 color scheme is
# generated from it; visitors can still pick their own in Settings.
# ui_accent = #22d3ee

# Default Material color style for visitors.
# One of: tonal_spot, vibrant, expressive, fidelity, neutral, monochrome
# ui_style = tonal_spot

# Where browsers load the ~31 MB ffmpeg.wasm core from. cdn = jsDelivr (no load on your
# server). local = downloaded once by the server (SHA-256 verified) and served from
# here.
# One of: cdn, local
# wasm_source = cdn

[ytdlp]

# Path to a yt-dlp executable. Empty = use the yt-dlp Python package if installed, else
# yt-dlp(.exe) in the app folder, else yt-dlp on PATH.
# ytdlp_path = 

# Path to ffmpeg. Empty = ffmpeg(.exe) in the app folder, else PATH.
# ffmpeg_path = 

# JavaScript runtime yt-dlp uses for YouTube's player challenges. auto = deno, then
# node, then bun.
# One of: auto, deno, node, bun, none
# js_runtime = auto

# Netscape-format cookies.txt passed to yt-dlp (helps with 'confirm you're not a bot'
# and age-restricted videos). Use a throwaway account.
# cookies_file = 

# HTTP(S) proxy for yt-dlp and the relay, e.g. http://user:pass@host:3128.
# proxy = 

# Extra yt-dlp arguments appended to every call (shell-style quoting).
# extra_args = 

[updates]

# Check GitHub for new YTDL-UI releases (shown to admins and in the server log).
# update_check = true

# GitHub repo to check.
# update_repo = JustAyden/YTDL-UI

# Hours between release checks.
# update_check_hours = 12

# Let admins install YTDL-UI updates from the admin panel (the app restarts itself).
# allow_web_update = false

# Keep yt-dlp up to date automatically. Sites change constantly; an old yt-dlp is the #1
# cause of failed downloads.
# ytdlp_auto_update = true

# Hours between yt-dlp update checks.
# ytdlp_update_hours = 24

# yt-dlp release channel.
# One of: stable, nightly
# ytdlp_channel = stable

# If ffmpeg is missing on Windows or Linux, download a static build (from yt-dlp/FFmpeg-
# Builds, checksum-verified) into data/bin on first start. Not needed when
# processing_mode = browser.
# ffmpeg_auto_install = true
